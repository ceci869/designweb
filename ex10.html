<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Exercício 10</title>
</head>
<body>
    <div x-data="{ mensagem: 'Saiu!'}"
         x-text="mensagem"
         @mouseenter="mensagem = 'Entrou!' "
         @mouseout="mensagem = 'Saiu!' "
         class="w-30 h-30 border-2 border-cyan-200 text-cyan-600 rounded flex justify-center items-center mx-auto mt-10">
    </div>
</body>
</html>
