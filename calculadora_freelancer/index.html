<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Calculadora Freelancer</title>
</head>
<body>
    <div x-data class="w-150 my-50 mx-auto p-4 border-1 border-stone-300 rounded-md">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-dollar-sign text-xl text-green-600 bg-green-100 px-3 py-2 rounded-full"></i>            
            <h3 class="text-sm font-semibold">Orçamento #001</h3>
        </div>

        <hr class="mt-3 text-stone-200">

        <div class="mt-3 mb-4 flex justify-center gap-3">
            <input type="text" x-model="$store.calculadora.novoServico" 
                   class="pl-2 py-1 border-stone-300 rounded-sm flex-1" placeholder="Nome" @keydown.enter="$store.calculadora.add()">
            <input x-model.number="$store.calculadora.novoPreco" 
                   class="pl-2 w-40 border-stone-300 rounded-sm" placeholder="Preço" @keydown.enter="$store.calculadora.add()">
            <button @click="$store.calculadora.add()"
                    class="px-3 rounded-sm bg-green-100 cursor-pointer transition hover:bg-green-300"><i class="fa-solid fa-plus text-green-600"></i></button>
        </div>

      
        <template x-for="servico in $store.calculadora.servicos" :key="servico.id">
            <ul class="p-2 mt-2 border-1 border-stone-300 rounded-sm flex justify-between">
                <li x-text="servico.nome" class="text-stone-700"></li>
                <li x-text="'R$ ' + servico.preco" class="pr-12 font-semibold text-stone-700"></li>
            </ul> 
        </template>

        <div class="mt-6 p-3 bg-gray-900 rounded-sm shadow-md flex justify-between">
            <span class="text-gray-300">TOTAL</span>
            <span x-text="'R$ ' + $store.calculadora.total()" class="text-green-400 pr-12"></span>
        </div>

    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('calculadora', {
                novoServico: '',
                novoPreco: Number(''),
                servicos: [
                    {id: 1, nome: 'Logo Design', preco: 500},
                    {id: 2, nome: 'Website', preco: 500}
                ],

                get add() {
                    if (!this.novoServico, !this.novoPreco) return;
                    this.servicos.push({id: Date.now, nome: this.novoServico, preco: this.novoPreco});
                    this.novoServico = '',
                    this.novoPreco = Number('');
                },

                total() {
                    let valorTotal = 0;
                    for (i = 0; i < this.servicos.length; i++) {
                        valorTotal = valorTotal + this.servicos[i].preco
                    };
                    return valorTotal;
                }

            })
        })
    </script>

</body>
</html>
