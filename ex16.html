<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Exercício 16</title>
</head>
<body>
    <div x-data="{ tab: 1, clicked: false }" class=" flex flex-col items-center justify-center gap-4 mt-10">
        <div class="space-x-4">
            <button class="w-20 p-2 border-2 border-rose-200 text-rose-600"
                    @click="tab = 1">
            Tab 1
            </button>

            <button class="w-20 p-2 border-2 border-rose-200 text-rose-600"
                    @click="tab = 2">
            Tab 2
            </button>

            <button class="w-20 p-2 border-2 border-rose-200 text-rose-600"
                    @click="tab = 3">
            Tab 3
            </button>
        </div>

        <div x-show="tab === 1" class="w-70 p-2 text-center border-3 border-rose-400 rounded-md text-rose-400">DIV 1</div>
        <div x-show="tab === 2" class="w-70 p-2 text-center border-3 border-rose-500 rounded-md text-rose-500">DIV 2</div>
        <div x-show="tab === 3" class="w-70 p-2 text-center border-3 border-rose-600 rounded-md text-rose-600">DIV 3</div>

    </div>
</body>
</html>
