<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Exercício 20</title>
</head>
<body>
    <figure x-data="{ scale: false }" class="flex justify-center mt-40">
        <img src="img/sundayyy.jpg" alt="Sunday" class="w-100 rounded-md transition"
             @mouseenter="scale = !scale"
             @mouseout="scale = false"
             :class="scale ? 'scale-150 duration-200 ease-in-out' : ''" >
    </figure>
    
</body>
</html>
