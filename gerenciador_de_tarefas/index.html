<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Gerenciador de Tarefas</title>
</head>
<body class="p-4 bg-stone-100 flex place-content-center">
    <div x-data class="w-200 m-6 p-6 bg-white rounded-md">
        <div class="flex items-center justify-between">
            <h1 class="text-3xl font-bold">Minhas Tarefas</h1>
            <span 
            class="px-4 py-1 bg-blue-200 font-bold text-blue-800 rounded-3xl"
            x-text="$store.todo.items.filter(i => !i.done).length + ' pendentes'"></span>
        </div>

        <div class="flex items-baseline gap-x-2">
            <input placeholder="Nova tarefa..."
            class="w-170 p-2 mt-4 border-stone-300 rounded-sm"
            x-model="$store.todo.novoItem" @keydown.enter="$store.todo.add()">
            <button @click="$store.todo.add()" class="py-2 px-3 bg-blue-600 rounded-md cursor-pointer"><i class="fa-solid fa-plus"></i></button>
        </div>

        <ul class="space-y-2 mt-4">
            <template x-for="item in $store.todo.items" :key="item.id">
                <div class="w-182 p-3 border-1 border-stone-300 rounded-sm flex justify-between items-center cursor-pointer">
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 border-1 border-stone-300 rounded-sm"></div>
                        <li x-text="item.text"></li>
                    </div>

                    <button @click="$store.todo.items = $store.todo.items.filter( i => i !== item )" 
                    class="opacity-0 transition hover:opacity-100 cursor-pointer text-red-500">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            </template>
        </ul>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store( 'todo',
            {   novoItem: '',
                filter: 'all',
                items: [
                    {id: 1, text:'Aprender Alpine.js', done: true},
                    {id: 2, text:'Criar Store Global', done: false},
                    {id: 3, text:'Finalizar projeto', done: false}
                ],

                get filtered() {
                    if (this.filter === 'done')
                        return this.items.filter(i => i.done);
                    if (this.filter === 'todo')
                        return this.items.filter(i => !i.done);
                    return this.items;
                },

                add() {
                    if (!this.novoItem) return;
                    this.items.push({id: Date.now, text: this.novoItem, done: false});
                    this.novoItem = '';
                }

            })
        })
        
    </script>
</body>
</html>
